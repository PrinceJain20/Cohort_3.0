<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>INSECT</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="logo">INSECT</div>

      <div class="search">
        <span>&#128269;</span>
        <input type="text" placeholder="Search..." />
      </div>

      <nav>
        <a href="#">Home</a>
        <a href="#">Shop</a>
        <a href="#">About</a>
        <a href="#">Gallery</a>
        <a href="#">Contact</a>
      </nav>
    </header>
    <div class="center-image">
      <img src="insect.jpg" alt="Insect" />
    </div>
    <main>
      <div class="left">
        <h2>Classification</h2>
        <div class="list">
          <div class="item">
            <span class="dot"></span>
            <strong>Class:</strong>
            <p>Insecta</p>
          </div>
          <div class="item">
            <span class="dot"></span>
            <strong>Order:</strong>
            <p>Coleoptera</p>
          </div>
          <div class="item">
            <span class="dot"></span>
            <strong>Family:</strong>
            <p>Cerambycidae</p>
          </div>
          <div class="item">
            <span class="dot"></span>
            <strong>Sub-Family:</strong>
            <p>Cerambycinae</p>
          </div>
          <div class="item">
            <span class="dot"></span>
            <strong>Tribe:</strong>
            <p>Callicromatini</p>
          </div>
          <div class="item">
            <span class="dot"></span>
            <strong>Genus:</strong>
            <p>Pachyteria</p>
          </div>
        </div>
      </div>

      <div class="right">
        <h1>Pachyteria<br />equestris</h1>

        <div class="info-box">
          <div class="beetle-size">
            <div class="beetle-icon">&#129712;</div>
            <span>32 mm</span>
          </div>

          <div class="divider"></div>

          <div class="details">
            <p><span>&#128205; Locality:</span> Malaysia</p>
            <p><span>&#9794; Sex:</span> Male</p>
            <p><span>&#128207; Size:</span> 32 mm / 12 mm</p>
          </div>
        </div>

        <div class="price">$5.99</div>

        <div class="toggles">
          <label>
            <input type="checkbox" />
            <span class="slider"></span>
            View detailed antennae
          </label>
          <br /><br />
          <label>
            <input type="checkbox" />
            <span class="slider"></span>
            View underside
          </label>
        </div>

        <button>Add to collection</button>
      </div>
    </main>
  </body>
</html>
