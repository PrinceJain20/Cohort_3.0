<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ScaleX - Blogs</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <nav class="navbar">
      <div class="logo">
       <img src="logo.png" alt="">
      </div>

      <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">About Us</a>
        <a href="#">Blogs</a>
        <a href="#">Contact Us</a>
      </div>

      <button class="get-started">Get Started</button>
    </nav>

    <main>
      <section class="hero">
        <h1>Insights & Blogs</h1>

        <div class="categories">
          <button class="category active">All</button>

          <button class="category">Tech</button>

          <button class="category">SaaS</button>

          <button class="category">Marketing</button>
        </div>
      </section>

      <section class="blog-container">
        <article class="blog-card">
          <div class="blog-image">
            <img src="img1.png" alt="" />
          </div>

          <div class="blog-content">
            <span class="tag"> Tech </span>

            <h2>The Ultimate Guide To SaaS Marketing</h2>

            <p class="date">May 23, 2025</p>
          </div>
        </article>

        <article class="blog-card">
          <div class="blog-image"><img src="img2.png" alt=""></div>

          <div class="blog-content">
            <span class="tag"> SaaS </span>

            <h2>5 Key Trends In SaaS Growth For 2025</h2>

            <p class="date">May 23, 2025</p>
          </div>
        </article>

        <article class="blog-card">
          <div class="blog-image"><img src="img3.png" alt=""></div>

          <div class="blog-content">
            <span class="tag"> Marketing </span>

            <h2>How Data-Driven Strategies Are Important</h2>

            <p class="date">May 23, 2025</p>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
