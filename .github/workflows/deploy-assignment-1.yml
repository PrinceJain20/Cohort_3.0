name: Deploy Assignment 1

on:
  push:
    branches:
      - main
    paths:
      - 'Assignment-1/**'
      - '.github/workflows/deploy-assignment-1.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Assignment 1
        uses: actions/upload-pages-artifact@v3
        with:
          path: './Assignment-1'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
